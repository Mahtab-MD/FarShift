# FairShift: Production Nginx Security Headers Configuration
# Designed for high-security zero-trust web deployment under UN SDG 8

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 1. Content Security Policy (CSP): Strict origin restriction, allow self & Supabase endpoint
    # Adjust $VITE_SUPABASE_URL domain in production CI/CD replacement
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; connect-src 'self' https://*.supabase.co wss://*.supabase.co; img-src 'self' data: blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none';" always;

    # 2. X-Content-Type-Options: Prevent MIME-sniffing
    add_header X-Content-Type-Options "nosniff" always;

    # 3. X-Frame-Options: Protect against Clickjacking
    add_header X-Frame-Options "SAMEORIGIN" always;

    # 4. Referrer-Policy: Protect privacy on outbound navigations
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 5. Permissions-Policy: Restrict browser hardware APIs explicitly to self (Geolocation & Microphone only)
    add_header Permissions-Policy "geolocation=(self), microphone=(self), camera=(), payment=(), usb=()" always;

    # 6. Strict-Transport-Security (HSTS)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Cache control for static assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, no-transform, immutable";
    }

    # SPA fallback to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
